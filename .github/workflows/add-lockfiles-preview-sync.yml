name: add-lockfiles-preview-sync
on:
  push:
    paths:
      - .github/workflows/add-lockfiles-preview-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch lockfiles from public storage
        run: |
          set -euo pipefail
          curl -fsSL "https://mythex-public-assets.s3.us-west-2.amazonaws.com/app-storage/cmuguotbu0061o6016a89vrl3/lockfile-sync/package-lock.json" -o package-lock.json
          curl -fsSL "https://mythex-public-assets.s3.us-west-2.amazonaws.com/app-storage/cmuguotbu0061o6016a89vrl3/lockfile-sync/web-package-lock.json" -o web/package-lock.json
          test "$(git hash-object package-lock.json)" = "43d40f262641d9cd5ee273fbda4864a7e93548bf"
          test "$(git hash-object web/package-lock.json)" = "7ac18f10bcd856e4fb433e56e3de127331368a17"
      - name: Commit lockfiles
        run: |
          set -euo pipefail
          git config user.name "mythex-agent"
          git config user.email "agent@mythex.app"
          git add package-lock.json web/package-lock.json
          git rm -q .github/workflows/add-lockfiles-preview-sync.yml
          git commit -m "Add npm lockfiles for reproducible installs"
          git push
